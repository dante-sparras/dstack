name: CI

on:
  pull_request:
  push:
    branches:
      - {{DEFAULT_BRANCH}}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    # The ruleset requires this job by name. Rename it there too if you rename it here.
    name: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
{{CI_STEPS}}
